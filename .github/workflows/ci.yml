# Three guardrails on every push and PR (issues/03): golden tests against real
# bedtools, testthat unit tests, and lintr. Each runs in its own step so a red run
# names which one broke; the golden and unit steps compare exit codes and diff
# stdout inside the scripts themselves. Run the same three locally:
#   ./tests/run_golden.sh   ./tests/run_unit.sh   ./tests/run_lint.sh
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bedtools (the oracle)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bedtools
          bedtools --version

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install test-time R packages (runtime is base R only)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::lintr

      - name: Golden tests (diff against bedtools)
        run: ./tests/run_golden.sh

      - name: Unit tests (testthat, no bedtools)
        if: ${{ !cancelled() }}
        run: ./tests/run_unit.sh

      - name: Lint (lintr)
        if: ${{ !cancelled() }}
        run: ./tests/run_lint.sh
